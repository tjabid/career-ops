# Portal Scanner Configuration — Tajjallee Abid
# React / Next.js / React Native frontend engineer, Dubai UAE.
# Target: EU / Sweden / Nordics / broader Europe — fully remote OR visa sponsorship.

title_filter:
  positive:
    - "React"
    - "Next.js"
    - "NextJS"
    - "React Native"
    - "Frontend"
    - "Front-end"
    - "Front End"
    - "Web Engineer"
    - "Web Developer"
    - "JavaScript"
    - "TypeScript"
    - "Full Stack"
    - "Fullstack"
    - "Mobile Engineer"
  negative:
    - "Junior"
    - "Intern"
    - "Entry Level"
    - "Vue"
    - "Angular"
    - "DevOps"
    - "Backend"
    - "iOS Native"
    - "Android Native"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "SRE"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Java "
    - ".NET"
    - "Python"
    - "Data Scientist"
    - "Machine Learning"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"

search_queries:
  - name: Greenhouse — React EU Senior
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "React" OR "Next.js" "Senior" (Europe OR remote) frontend engineer'
    enabled: true

  - name: Ashby — React/Next.js EU
    query: 'site:jobs.ashbyhq.com "React" OR "Next.js" OR "React Native" "Senior" (Europe OR remote OR Berlin OR Stockholm OR Amsterdam OR London OR Dublin OR Lisbon)'
    enabled: true

  - name: Lever — React EU
    query: 'site:jobs.lever.co "Senior React" OR "Senior Frontend" OR "React Native" (Europe OR remote OR Berlin OR Stockholm OR Amsterdam OR Dublin OR London)'
    enabled: true

  - name: Remotive — React Frontend EU
    query: 'site:remotive.com "React" OR "Next.js" OR "React Native" "Senior" frontend engineer Europe remote'
    enabled: true

  - name: WeWorkRemotely — React Senior
    query: 'site:weworkremotely.com "React" OR "Next.js" "Senior Frontend" OR "Senior React" OR "React Native"'
    enabled: true

  - name: EU Remote Jobs — React Frontend
    query: 'site:euremotejobs.com "React" OR "Next.js" OR "React Native" frontend engineer'
    enabled: true

  - name: Himalayas — React EU
    query: 'site:himalayas.app "React" OR "Next.js" OR "React Native" "Senior" frontend Europe remote'
    enabled: true

  - name: Welcome to the Jungle — Frontend EU
    query: 'site:welcometothejungle.com "React" OR "Next.js" OR "React Native" Senior frontend Europe'
    enabled: true

  - name: LinkedIn — React EU Remote Sponsorship
    query: '"React" OR "Next.js" OR "React Native" "Senior" frontend engineer (Europe OR EU OR Sweden OR Netherlands OR Germany OR Ireland OR Portugal) "visa sponsorship" OR "relocation" OR "remote"'
    enabled: true

  - name: Nordics React Remote
    query: '"React" OR "Next.js" "Senior Frontend" OR "Senior Software Engineer" (Stockholm OR Copenhagen OR Helsinki OR Oslo) remote OR "visa sponsorship" OR relocation'
    enabled: true

  - name: Sweden React Engineering
    query: '"React" OR "Next.js" OR "React Native" senior engineer Sweden Stockholm remote OR "work from anywhere" OR "relocation package"'
    enabled: true

  - name: Netherlands React Remote
    query: '"React" OR "Next.js" "Senior Frontend" OR "Senior React Engineer" Netherlands Amsterdam remote OR "visa sponsorship"'
    enabled: true

  - name: Berlin React Remote
    query: '"React" OR "Next.js" OR "React Native" "Senior" frontend engineer Berlin Germany remote OR "visa sponsorship" OR relocation'
    enabled: true

  - name: Workable — React EU
    query: 'site:apply.workable.com "React" OR "Next.js" OR "React Native" "Senior" frontend engineer remote Europe'
    enabled: true

